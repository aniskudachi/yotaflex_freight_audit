services:
  - type: web
    name: yotaflex-freight-audit
    runtime: python
    buildCommand: python -m pip install -r requirements.txt && python src/load_sqlite.py
    startCommand: python src/app.py --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
